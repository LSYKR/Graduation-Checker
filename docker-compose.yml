services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_ORIGIN: http://localhost:3000
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
      LLM_MODEL: ${LLM_MODEL:-qwen3:8b}
      LLM_LARGE_MODEL: ${LLM_LARGE_MODEL:-}
      LLM_LARGE_BASE_URL: ${LLM_LARGE_BASE_URL:-}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-8192}
      LLM_API_KEY: ${LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "3"
